[graph]
exclude-unpublished = true
exclude-dev = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
