[workspace]
resolver = "2"
members = [
    "rglm",
    "rglm-derive",
    "codegen",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rokuz/rglm"
keywords = ["glsl", "glm", "vulkan", "math", "simd"]
categories = ["mathematics", "game-development", "rendering", "no-std"]
authors = ["rglm developers", "glam developers"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cloned_instead_of_copied = "warn"
trivially_copy_pass_by_ref = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
unnested_or_patterns = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
derive_partial_eq_without_eq = "warn"
ref_as_ptr = "warn"

[workspace.dependencies]
rglm = { version = "0.1.0", path = "./rglm", default-features = false }
rglm-derive = { version = "0.1.0", path = "./rglm-derive" }
anyhow = { version = "1.0.87", default-features = false, features = ["std"] }
arbitrary = { version = "1.4.2", default-features = false }
bytemuck = { version = "1.18", default-features = false, features = ["derive"] }
glam = { version = "0.34.3", default-features = false, features = ["std"] }
half = { version = "2.5", default-features = false }
libm = { version = "0.2.6", default-features = false }
mint = { version = "0.5", default-features = false }
rustfmt-wrapper = "0.2"
serde = { version = "1.0.225", default-features = false }
serde_core = { version = "1.0.225", default-features = false }
serde_json = { version = "1.0.143", default-features = false, features = ["std"] }
tera = { version = "2", default-features = false, features = ["glob_fs"] }
toml = "0.8"

[profile.release]
lto = "thin"
debug = true

[profile.bench]
lto = "thin"
codegen-units = 1
